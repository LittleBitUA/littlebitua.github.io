name: Deploy to GitHub Pages

on:
  push:
    branches: [main, _newdesign]
  workflow_dispatch:
  # Щодня о 06:00 за Києвом (03:00 UTC): пересобираємо сайт,
  # щоб підтягнути актуальні суми зборів із Donatello.
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write # щоденний запис журналу прогресу (src/data/progress-log.json)
  issues: write   # issue «Розбіжності з LBK Launcher»
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # Журнал прогресу для графіків на сторінках ігор + перевірка розбіжностей із LBK Launcher
      - name: Record progress and check LBK Launcher
        if: github.ref == 'refs/heads/main'
        run: npm run progress
        continue-on-error: true

      - name: Save progress log
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          git add src/data/progress-log.json src/data/descriptions.json src/data/launcher-stages.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Progress log and launcher descriptions: $(TZ=Europe/Kyiv date +%F)"
          git pull --rebase origin main && git push origin HEAD:main

      # Розбіжності є — створює або оновлює issue; зникли — закриває його
      - name: Report LBK Launcher mismatches
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Розбіжності з LBK Launcher"
          REPORT=node_modules/.cache/lb-progress/report.md
          [ -f "$REPORT" ] || exit 0
          N=$(gh issue list --state open --limit 100 --json number,title -q ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ -s "$REPORT" ]; then
            if [ -n "$N" ]; then gh issue edit "$N" --body-file "$REPORT"; else gh issue create --title "$TITLE" --body-file "$REPORT"; fi
          elif [ -n "$N" ]; then
            gh issue close "$N" --comment "Розбіжностей більше немає."
          fi

      # Превʼю посилань (og.png, og-chronology.png) зі свіжими даними; без Chrome лишаються збережені
      - name: Generate link previews
        run: npm run og
        continue-on-error: true

      - name: Build Astro
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
